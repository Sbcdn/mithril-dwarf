[package]
name = "mithril-dwarf"
version = "0.1.0"
edition = "2024"

[features]
default = []
host = ["dep:anyhow","dep:mithril-client","dep:mithril-common","dep:mithril-stm"]

[dependencies]
blake2 = "0.10.6"
fixed = "1.28"
num-bigint = { version = "0.4.6" }
num-rational = { version = "0.4.2" }
num-traits = { version = "0.2.19" }
hex = "*"
chrono = "0.4.41"
blst = "=0.3.15"
sha2 = "=0.10.9"
# For host compilation must be 2.2 but precompiles in rsc0 only support 2.1.1 atm
ed25519-dalek = { version = "=2.1.1", features = ["digest"] }

# Optional: Only for Writer and Converter with "host" feature flag
anyhow = { version = "1.0.94", optional = true }
mithril-client = { path = "../mithril/mithril-client/", features = ["num-integer-backend"], optional = true} #
mithril-common = { path = "../mithril/mithril-common", features = ["num-integer-backend"], optional = true} #
mithril-stm = { path = "../mithril/mithril-stm", features = ["benchmark-internals","num-integer-backend"], optional = true} #

#[patch.crates-io]
#ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0"}
#blst = { git = "https://github.com/risc0/blst", tag = "v0.3.15-risczero.1"}
#sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0"}

[dev-dependencies]
bincode = "1.3"
async-trait = "0.1.89"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }
iai-callgrind = "0.16"
proptest = "1.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full","rt","macros"] }
slog = "2.8.2"
once_cell = "1.19"

[profile.bench]
debug = true

[[bench]]
name = "cycle_count"
harness = false

[[bench]]
name = "certificate_parsing"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_comparison"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_cycles"
harness = false