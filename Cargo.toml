[workspace]
members = [".", "mithril-dwarf-harness"]
resolver = "2"

[package]
name = "mithril-dwarf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Torben Poguntke <sbcdn@pm.me>"]

[features]
default = []
host = ["dep:anyhow","dep:mithril-client","dep:mithril-common","dep:mithril-stm"]
# Reserved no-op feature so `#[cfg(feature = "future_snark")]` branches in
# the host adapter compile cleanly without a `check-cfg` warning. dwarf
# does not currently enable the SNARK proof system on its mithril deps.
future_snark = []
# Guest-only profiling: emits per-section `env::cycle_count()` deltas from
# `verify_bls_multisig` (lottery-compare / dense-mapping / Merkle / BLS) to
# stderr. Compiles to nothing when off; never enable for host or production.
guest-bench = []

[dependencies]
blake2 = "0.10.6"
fixed = "1.28"

crypto-bigint = { version = "0.5.5", features = ["alloc"] }
crypto-ratio = "0.2.0"

hex = "*"
chrono = "0.4.41"
blst = "=0.3.15"
sha2 = "=0.10.9"
# For host compilation must be 2.2 but precompiles in rsc0 only support 2.1.1 atm
# Switched it in mithril-common to 2.1.1 as that was also sufficent.
ed25519-dalek = { version = "=2.1.1", features = ["digest"] }
risc0-zkvm = { version = "^3.0.3", default-features = false, features = ['std'] }

# Optional: Only for Writer and Converter with "host" feature flag.
# Upstream Mithril is pinned by rev (not branch) so the harness, the
# guest, and any downstream consumer all see the same code; flip the rev
# explicitly when ready to bump.
anyhow = { version = "1.0.94", optional = true }
mithril-client = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend", "rustls"], optional = true }
mithril-common = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend"], optional = true }
mithril-stm = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["benchmark-internals", "num-integer-backend"], optional = true }

# ============================================================
# CRITICAL: RISC0 PRECOMPILE PATCHES — DOWNSTREAM GUEST REQUIRED
# ============================================================
#
# The patch block below is INTENTIONALLY commented out in this
# library crate. It MUST be applied by the downstream zkVM guest
# consumer (e.g. `oaks_cert/guest/Cargo.toml`).
#
# Without these patches:
#   * `sha2` runs in pure software in the RISC0 guest. Production
#     cycle estimates (~351M cycles per standard cert) are
#     UNATTAINABLE without the SHA-256 precompile.
#   * `blst` BLS12-381 operations run in pure software. BLS
#     aggregate verify (the dominant per-cert cost) becomes
#     prohibitively expensive — orders of magnitude more cycles.
#   * `ed25519-dalek` runs in pure software for genesis cert
#     verification. Less catastrophic (genesis is a one-off) but
#     still meaningful.
#
# Why patches go in the guest, not here:
#   * dwarf must also build on host (x86_64) for the equivalence
#     harness in `mithril-dwarf-harness/`. The risc0-fork crates
#     don't build cleanly outside the zkVM target.
#   * Rust's `[patch.crates-io]` is a workspace-level mechanism —
#     applying it here would propagate to every dependent and
#     break the harness.
#
# DOWNSTREAM CHECKLIST (oaks_cert guest):
#   1. Copy the four lines below (uncommented) into
#      oaks_cert/guest/Cargo.toml under `[patch.crates-io]`.
#   2. Rebuild the guest ELF.
#   3. Run a single-cert verify and confirm cycle count is in
#      the ~351M range. If 10× higher, the patches are not
#      applied.
#
# Reference patches (keep version tags pinned to match the
# unpatched versions above so semver doesn't drift):
#
#[patch.crates-io]
#ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0"}
#blst = { git = "https://github.com/risc0/blst", tag = "v0.3.15-risczero.1"}
#sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0"}


[dev-dependencies]
bincode = "1.3"
async-trait = "0.1.89"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }
iai-callgrind = "0.16"
proptest = "1.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full","rt","macros"] }
slog = "2.8.2"
once_cell = "1.19"
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.bench]
debug = true

[[bench]]
name = "cycle_count"
harness = false
required-features = ["host"]

[[bench]]
name = "certificate_parsing"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_comparison"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_cycles"
harness = false
required-features = ["host"]

[[bench]]
name = "equivalence_performance"
harness = false
required-features = ["host"]

[[bench]]
name = "ed25519_strict"
harness = false

