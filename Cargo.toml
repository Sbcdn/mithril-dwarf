[workspace]
members = [".", "mithril-dwarf-harness"]
resolver = "2"

[package]
name = "mithril-dwarf"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Torben Poguntke <sbcdn@pm.me>"]
description = "Cycle-optimized, allocation-free Cardano Mithril certificate verifier for zkVM guests, bit-equivalent to upstream Mithril."
repository = "https://github.com/Sbcdn/mithril-dwarf"
readme = "README.md"
keywords = ["mithril", "cardano", "zkvm", "risc0", "verification"]
categories = ["cryptography::cryptocurrencies", "cryptography"]

[features]
default = []
host = ["dep:anyhow", "dep:chrono", "dep:mithril-client", "dep:mithril-common", "dep:mithril-stm", "dep:serde", "dep:serde_json", "dep:bincode2"]
# Reserved no-op feature so `#[cfg(feature = "future_snark")]` branches in
# the host adapter compile cleanly without a `check-cfg` warning. dwarf
# does not currently enable the SNARK proof system on its mithril deps.
future_snark = []
# Guest-only profiling: emits per-section `env::cycle_count()` deltas from
# `verify_bls_multisig` (lottery-compare / dense-mapping / Merkle / BLS) to
# stderr. Compiles to nothing when off; never enable for host or production.
guest-bench = []
# Cardano-transaction Merkle-inclusion proofs (oaks_tx consumer). Guest-side,
# serde-free; Blake2s256 MMR over ckb-merkle-mountain-range (no_std). Off by
# default so nothing leaks into oaks_cert.
tx-inclusion = ["dep:ckb-merkle-mountain-range"]
# Cardano transaction parsing for oaks_tx. Phase A = txid hasher (blake2b only,
# no extra deps); Phase B (pallas CBOR-locate + script/datum hashes) lands later.
tx-parsing = []
# Phase B: byte-exact CBOR component locate (§5) + script_data_hash binding.
# pallas-primitives needs `serde` (derive only) to build; NOT `json` — that pulls
# serde_json. No pallas-traverse (it force-enables json). Validated for the
# riscv32im-risc0-zkvm-elf guest target. cryptoxide-based, no crypto patches.
tx-components = [
    "tx-parsing",
    "dep:pallas-primitives",
    "dep:pallas-codec",
    "dep:pallas-crypto",
]

[dependencies]
blake2 = "0.10.6"
fixed = "1.28"
# Merkle Mountain Range proof verify for `tx-inclusion`; no_std (no serde).
ckb-merkle-mountain-range = { version = "0.6.1", default-features = false, optional = true }

# tx-components (Phase B): Conway tx decode + KeepRaw byte-exact spans +
# `ScriptData::build_for().hash()` for script_data_hash. `serde` feature = derive
# only (no serde_json / no JSON in guest); no pallas-traverse. Guest-validated.
pallas-primitives = { version = "=1.0.0", default-features = false, features = ["serde"], optional = true }
pallas-codec = { version = "=1.0.0", default-features = false, optional = true }
pallas-crypto = { version = "=1.0.0", default-features = false, optional = true }

crypto-bigint = { version = "0.5.5", features = ["alloc"] }
crypto-ratio = "0.2.0"

hex = "0.4"
blst = "=0.3.15"
sha2 = "=0.10.9"
# For host compilation must be 2.2 but precompiles in rsc0 only support 2.1.1 atm
# Switched it in mithril-common to 2.1.1 as that was also sufficent.
ed25519-dalek = { version = "=2.1.1", features = ["digest"] }
risc0-zkvm = { version = "^3.0.3", default-features = false, features = ['std'] }

# Optional: only the host-only writer/converter modules and the equivalence
# harness. Upstream Mithril is pinned by rev (not branch) so the harness, the
# guest, and any downstream consumer all see the same code; flip the rev
# explicitly when ready to bump.
anyhow = { version = "1.0.94", optional = true }
chrono = { version = "0.4.41", optional = true }
mithril-client = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend", "rustls", "unstable"], optional = true }
mithril-common = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend"], optional = true }
mithril-stm = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["benchmark-internals", "num-integer-backend"], optional = true }

# Host-only: the tx-inclusion proof transcoder (upstream json/bincode -> custom
# wire). serde mirror decodes the upstream proof; never enters the guest.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode2 = { package = "bincode", version = "2.0.1", features = ["serde"], optional = true }

# ============================================================
# CRITICAL: RISC0 PRECOMPILE PATCHES — DOWNSTREAM GUEST REQUIRED
# ============================================================
#
# The patch block below is INTENTIONALLY commented out in this
# library crate. It MUST be applied by the downstream zkVM guest
# consumer (e.g. `oaks_cert/guest/Cargo.toml`).
#
# Without these patches:
#   * `sha2` runs in pure software in the RISC0 guest. Production
#     cycle estimates (~351M cycles per standard cert) are
#     UNATTAINABLE without the SHA-256 precompile.
#   * `blst` BLS12-381 operations run in pure software. BLS
#     aggregate verify (the dominant per-cert cost) becomes
#     prohibitively expensive — orders of magnitude more cycles.
#   * `ed25519-dalek` runs in pure software for genesis cert
#     verification. Less catastrophic (genesis is a one-off) but
#     still meaningful.
#
# Why patches go in the guest, not here:
#   * dwarf must also build on host (x86_64) for the equivalence
#     harness in `mithril-dwarf-harness/`. The risc0-fork crates
#     don't build cleanly outside the zkVM target.
#   * Rust's `[patch.crates-io]` is a workspace-level mechanism —
#     applying it here would propagate to every dependent and
#     break the harness.
#
# DOWNSTREAM CHECKLIST (oaks_cert guest):
#   1. Copy the four lines below (uncommented) into
#      oaks_cert/guest/Cargo.toml under `[patch.crates-io]`.
#   2. Rebuild the guest ELF.
#   3. Run a single-cert verify and confirm cycle count is in
#      the ~351M range. If 10× higher, the patches are not
#      applied.
#
# Reference patches (keep version tags pinned to match the
# unpatched versions above so semver doesn't drift):
#
#[patch.crates-io]
#ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0"}
#blst = { git = "https://github.com/risc0/blst", tag = "v0.3.15-risczero.1"}
#sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0"}


# Test-only: the differential lottery tests diff dwarf's bounded-precision
# arithmetic against an arbitrary-precision `num` re-port of upstream.
[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
proptest = "1.4"

