[package]
name = "mithril-dwarf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Torben Poguntke <sbcdn@pm.me>"]

[features]
default = []
host = ["dep:anyhow","dep:mithril-client","dep:mithril-common","dep:mithril-stm"]
tests = ["dep:reqwest","dep:tokio","dep:clap","dep:serde","dep:serde_json","dep:bincode","dep:slog","host"]

[dependencies]
blake2 = "0.10.6"
fixed = "1.28"

crypto-bigint = { version = "0.5.5", features = ["alloc"] }
#crypto-ratio = { path="../crypto-ratio" }
crypto-ratio = "0.1.0"

hex = "*"
chrono = "0.4.41"
blst = "=0.3.15"
sha2 = "=0.10.9"
# For host compilation must be 2.2 but precompiles in rsc0 only support 2.1.1 atm
# Switched it in mithril-common to 2.1.1 as that was also sufficent. 
ed25519-dalek = { version = "=2.1.1", features = ["digest"] }
risc0-zkvm = { version = "^3.0.3", default-features = false, features = ['std'] }

# Optional: Only for Writer and Converter with "host" feature flag
anyhow = { version = "1.0.94", optional = true }
mithril-client = { git = "https://github.com/Sbcdn/mithril.git", branch = "mithril_risc0", features = ["num-integer-backend"], optional = true} #
mithril-common = { git = "https://github.com/Sbcdn/mithril.git", branch = "mithril_risc0", features = ["num-integer-backend"], optional = true} #
mithril-stm = { git = "https://github.com/Sbcdn/mithril.git", branch = "mithril_risc0", features = ["benchmark-internals","num-integer-backend"], optional = true} #

#[patch.crates-io]
#ed25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0"}
#blst = { git = "https://github.com/risc0/blst", tag = "v0.3.15-risczero.1"}
#sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0"}

# Equivalence Test
reqwest = { version = "0.11", features = ["json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde ={ version= "1", optional = true  }
serde_json ={ version= "1", optional = true  }
bincode ={ version= "1.3", optional = true  }
slog ={ version= "2.8.2", optional = true  }

[[bin]]
name = "fetch_certificates"
path = "bin/fetch_certificates.rs"
required-features = ["tests"]

[[test]]
name = "equivalence_tests"
path = "tests/equivalence_tests.rs"
harness = true
required-features = ["tests"]


[dev-dependencies]
bincode = "1.3"
async-trait = "0.1.89"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["flamegraph", "criterion"] }
iai-callgrind = "0.16"
proptest = "1.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full","rt","macros"] }
slog = "2.8.2"
once_cell = "1.19"
num-bigint = "0.4"
num-rational = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.bench]
debug = true

[[bench]]
name = "cycle_count"
harness = false
required-features = ["host"]

[[bench]]
name = "certificate_parsing"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_comparison"
harness = false
required-features = ["host"]

[[bench]]
name = "verification_cycles"
harness = false
required-features = ["host"]

[[bench]]
name = "equivalence_performance"
harness = false
required-features = ["host"]