[package]
name = "mithril-dwarf-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Torben Poguntke <sbcdn@pm.me>"]
publish = false

[[bin]]
name = "fetch_certificates"
path = "src/bin/fetch_certificates.rs"

[[bin]]
name = "audit"
path = "src/bin/audit.rs"

[[bin]]
name = "fetch_tx_proof"
path = "src/bin/fetch_tx_proof.rs"

[[bin]]
name = "fetch_tx_proof_v2"
path = "src/bin/fetch_tx_proof_v2.rs"

[dependencies]
mithril-dwarf = { path = "..", features = ["host", "tx-inclusion", "tx-parsing", "tx-components"] }

# Upstream Mithril, pinned to a specific rev so the comparison reference
# can never silently drift between cargo invocations.
mithril-client = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend", "rustls", "unstable"] }
mithril-common = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend"] }
mithril-stm    = { git = "https://github.com/Sbcdn/mithril.git", rev = "7e787deefd079c3f2b3160785e58a6b4affc1340", features = ["num-integer-backend"] }

anyhow         = "1.0.94"
tokio          = { version = "1", features = ["full"] }
clap           = { version = "4", features = ["derive"] }
serde_json     = "1"
bincode        = "1.3"
hex            = "0.4"
async-trait    = "0.1.89"
slog           = "2.8.2"
chrono         = "0.4.41"
# fetch_tx_proof_v2: the v2/CardanoBlocksTransactions proof is only served by the
# testing-preview aggregator; the SDK's v2 verify path needs the preview genesis,
# so we capture the fixture with a plain GET (rustls, no openssl).
reqwest        = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Test-only: dwarf_rejects_bls_identity_in_cert in tests/equivalence.rs
# pins blst's identity-point behaviour. Keep the version pinned to the
# same release dwarf uses so the assertion tracks production behaviour.
[dev-dependencies]
blst = "=0.3.15"

# divergence_registry pin tests need direct access to ed25519-dalek
# and blake2 to construct synthetic adversarial inputs that exercise
# specific divergences. Same version pins as the production runtime.
ed25519-dalek = "=2.1.1"
blake2 = "=0.10.6"
sha2 = "=0.10.9"
