name: Upstream Mithril Drift Check

# Weekly + on-demand check: rebuild the equivalence harness against
# the LATEST upstream Mithril (Sbcdn/mithril.git#main) instead of the
# pinned rev (7e787deefd079c3f2b3160785e58a6b4affc1340). Any test
# failure here means upstream has diverged in a way our pinned-rev
# harness would not have caught.
#
# What this catches:
#   * Silent semantic changes upstream (e.g., a new check added to
#     verify_standard_certificate, a feed_hash byte-sequence change,
#     a discriminant reorder)
#   * Changes to dependencies (sha2, blake2, ed25519-dalek, blst) that
#     transitively change Mithril's behaviour
#   * Breaking type changes that prevent the harness compiling
#
# What this does NOT catch:
#   * Production-time drift if the dwarf consumer (oaks_cert) pins a
#     different upstream rev than we do
#   * Drift in non-Mithril dependencies the harness uses (we re-pin
#     ed25519-dalek and blake2 in the harness Cargo.toml)
#
# When this fails, the investigation path is:
#   1. Read the diff between the pinned rev and current upstream main:
#        git log 7e787de..main mithril-common mithril-stm mithril-client
#   2. Identify which test failed (per-cert byte equality, mutation
#      verdict, pin test).
#   3. Determine whether the upstream change should be reflected in:
#        a. A divergence registry entry update
#        b. A dwarf code change to match the new upstream behaviour
#        c. A test update (e.g., new pin for a new enum variant)
#   4. Bump the pinned rev in both Cargo.toml files once resolved.

on:
  schedule:
    # Mondays at 06:00 UTC — captures changes from the previous week
    # without spamming the CI runner.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}
  # Also runnable in pull-requests that modify the pinned rev — gives
  # a sanity check before bumping.
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'mithril-dwarf-harness/Cargo.toml'
      - '.github/workflows/upstream-drift-check.yml'

jobs:
  drift-check:
    runs-on: ubuntu-latest
    # Per-step `continue-on-error` (below) lets the report step run after
    # build/test failures so the diagnostic is emitted. The report step
    # itself uses `exit 1` on real drift — that must surface as a job
    # failure (red check, cron notification, branch-protection signal),
    # so we do NOT set `continue-on-error` at job level.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-drift-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-drift-cargo-

      - name: Apply upstream-main override patch
        run: |
          # Append a [patch.<repo>] section to the WORKSPACE Cargo.toml
          # that overrides the pinned rev with the current main branch.
          # Patch applies to all workspace members.
          cat >> Cargo.toml <<'EOF'

          # === DRIFT CHECK (CI only — DO NOT COMMIT) ===
          # Overrides the pinned-rev upstream Mithril deps to track
          # the current `main` branch. Any equivalence-harness test
          # failure here indicates upstream has changed in a way our
          # pinned-rev harness would not have caught.
          [patch."https://github.com/Sbcdn/mithril.git"]
          mithril-common = { git = "https://github.com/Sbcdn/mithril.git", branch = "main" }
          mithril-client = { git = "https://github.com/Sbcdn/mithril.git", branch = "main" }
          mithril-stm = { git = "https://github.com/Sbcdn/mithril.git", branch = "main" }
          EOF
          echo "Patched Cargo.toml:"
          tail -15 Cargo.toml

      - name: Update Cargo.lock to fetch upstream main
        run: |
          cargo update -p mithril-common -p mithril-client -p mithril-stm || true
          echo "Resolved versions:"
          cargo tree -p mithril-dwarf-harness 2>&1 | grep -E "mithril-(common|client|stm)" | head -10 || true

      - name: Build harness against upstream main
        id: build
        run: cargo build -p mithril-dwarf-harness --release --tests 2>&1
        continue-on-error: true

      - name: Run equivalence harness against upstream main
        id: harness
        if: steps.build.outcome == 'success'
        run: cargo test -p mithril-dwarf-harness --release 2>&1
        continue-on-error: true

      - name: Run intentional-divergence registry against upstream main
        id: divergences
        if: steps.build.outcome == 'success'
        run: cargo test -p mithril-dwarf-harness --release --test intentional_divergences 2>&1
        continue-on-error: true

      # Direct semantic check on the soundness-critical path: the positive
      # corpus is all-won and would not flip on a subtle lottery threshold
      # change, so behaviour tests can miss it. Diff upstream main's lottery
      # construction against the invariants dwarf's lottery_q / x build mirror.
      # The freshly-fetched main checkout is the newest eligibility.rs on disk.
      - name: Check upstream lottery construction (main)
        id: lottery
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          SRC=$(find ~/.cargo/git/checkouts -path '*mithril-stm/src/proof_system/concatenation/eligibility.rs' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
          echo "Newest upstream eligibility.rs: $SRC"
          test -n "$SRC" || { echo "could not locate upstream eligibility.rs"; exit 1; }
          MISSING=0
          while IFS= read -r inv; do
            grep -qF "$inv" "$SRC" || { echo "LOTTERY CHANGED: missing invariant -> $inv"; MISSING=1; }
          done <<'INV'
          BigInt::from(2u8).pow(512)
          Ratio::from_float((1.0 - phi_f).ln())
          (w * c).neg()
          taylor_comparison(1000
          new_x = (new_x.clone() * x.clone()) / divisor.clone()
          new_x.clone().abs() * BigInt::from(3)
          INV
          if [ "$MISSING" -ne 0 ]; then
            echo "::warning::Upstream lottery construction changed on main — SOUNDNESS REVIEW required before bumping the rev (re-sync the upstream_taylor / upstream_won re-port and the oracle pin)."
            exit 1
          fi
          echo "Lottery construction on main is unchanged from the pinned invariants."

      - name: Report drift status
        if: always()
        run: |
          BUILD=${{ steps.build.outcome }}
          HARNESS=${{ steps.harness.outcome }}
          DIVERGENCES=${{ steps.divergences.outcome }}
          LOTTERY=${{ steps.lottery.outcome }}

          echo "=== Upstream Drift Check Report ==="
          echo "Build:           $BUILD"
          echo "Equivalence:     $HARNESS"
          echo "Divergence pin:  $DIVERGENCES"
          echo "Lottery semantics: $LOTTERY"

          if [ "$BUILD" != "success" ]; then
            echo
            echo "BUILD FAILURE: upstream has type-level breaking changes."
            echo "   The pinned-rev harness will not catch these until rev bump."
            exit 1
          fi

          if [ "$LOTTERY" != "success" ]; then
            echo
            echo "LOTTERY DRIFT: upstream main changed the lottery construction."
            echo "   This is the soundness-critical path. Before bumping the rev:"
            echo "   re-review dwarf's lottery_q / per-signer x build, re-sync the"
            echo "   upstream_taylor / upstream_won re-port + the oracle pin, and"
            echo "   re-run the differential fuzz (cargo test -p mithril-dwarf --release -- --ignored)."
            exit 1
          fi

          if [ "$HARNESS" != "success" ] || [ "$DIVERGENCES" != "success" ]; then
            echo
            echo "DRIFT DETECTED: upstream behaviour differs from pinned rev."
            echo "   Pinned: 7e787deefd079c3f2b3160785e58a6b4affc1340"
            echo
            echo "   Investigation path:"
            echo "   1. Compare upstream commits:"
            echo "      git log 7e787de..main mithril-common mithril-stm mithril-client"
            echo "   2. Determine the failure class:"
            echo "      a. divergence-registry entry needs update"
            echo "      b. dwarf code needs to track upstream change"
            echo "      c. new pin test needed for new variant/discriminant"
            echo "   3. Bump pinned rev in Cargo.toml files once resolved."
            exit 1
          fi

          echo
          echo "No drift: upstream main is bit-equivalent to pinned rev."
